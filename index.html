<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <img src="keanu.webp" alt="Keanu Reeves Profile Picture">
        
        <div class="info">
            <h2>Keanu Reeves</h2>
            <p>Hollywood Actor</p>
        </div>

        <div class="number-grid">
            <div class="box">
                <p>93</p>
                <p>Posts</p>
            </div>
            <div class="box">
                <p>7M</p>
                <p>Followers</p>
            </div>
            <div class="box">
                <p>30</p>
                <p>Following</p>
            </div>
        </div>

        <div class="btn-box">
            <button class="follow">Follow</button>
            <button class="message">Message</button>
        </div>
    </div>
</body>
</html>
